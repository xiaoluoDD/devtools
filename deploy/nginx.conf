# DevTools 个人在线工具集 — Nginx 站点配置
# 用法：
#   1. 将本文件复制到 /etc/nginx/sites-available/devtools
#   2. ln -s /etc/nginx/sites-available/devtools /etc/nginx/sites-enabled/
#   3. 修改 server_name 与路径后 nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;   # 换成你的域名或公网 IP

    root /opt/devtools/frontend;
    index index.html;

    # 静态前端
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理 Go API（仅本机）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
        proxy_read_timeout 30s;
    }

    # 静态资源缓存（HTML 不长期缓存，避免发版后页面仍用旧 JS）
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
